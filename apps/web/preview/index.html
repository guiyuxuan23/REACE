<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="trace-development-token" content="__TRACE_LOCAL_TOKEN__">
  <title>TRACE · 听见你的美</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./apps/web/preview/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="masthead">
    <a class="wordmark" href="#main" aria-label="TRACE，回到正文">TRACE<span>.</span></a>
    <nav aria-label="页面导航"><a href="#practice">自然妆练习</a><a href="#memory">美妆记忆</a></nav>
    <button id="large" class="quiet" type="button" aria-pressed="false" disabled>大字模式</button>
  </header>
  <div class="notice" role="note"><strong>网页演练</strong><span>可以走完自然妆练习。课程使用示例，视觉不会分析妆效。</span></div>
  <main id="main" tabindex="-1">
    <section class="hero" aria-labelledby="title">
      <div class="hero-copy">
        <p class="edition" lang="en">Beauty Beyond Sight</p>
        <h1 id="title">听见你的美</h1>
        <p>按自己的节奏，从描述想要的妆容开始。每一步都能阅读、朗读或跳过。</p>
        <a class="primary" href="#practice">开始自然妆练习</a>
      </div>
      <div class="portrait" aria-hidden="true"><span></span></div>
    </section>

    <div class="workbench">
      <section id="practice" aria-labelledby="practice-title">
        <h2 id="practice-title">自然妆练习</h2>
        <form id="goal-form">
          <label for="goal">今天是什么场合，想要怎样的妆容？</label>
          <textarea id="goal" maxlength="500" rows="2" required>参加晚宴，想画个自然妆。</textarea>
          <div class="actions"><button type="submit" disabled>提交目标</button><button type="button" id="cancel" class="quiet" hidden>取消请求</button></div>
        </form>
        <p id="agent-result" class="result" role="status" hidden></p>
        <button type="button" id="confirm-goal" hidden>确认，开始演练</button>
        <div id="lesson" hidden>
          <p id="progress" class="eyeline"></p>
          <h3 id="step-title" tabindex="-1"></h3>
          <p id="step-body"></p>
          <div class="actions">
            <button type="button" id="next">完成这一步</button>
            <button type="button" id="repeat" class="quiet">朗读本步</button>
            <button type="button" id="skip-step" class="quiet">跳过</button>
            <button type="button" id="stop-lesson" class="quiet">结束练习</button>
          </div>
        </div>
        <div id="completion" hidden>
          <h3 id="completion-title" tabindex="-1">本次练习小结</h3>
          <p id="completion-text"></p>
          <div class="actions">
            <button type="button" id="read-completion">朗读小结</button>
            <button type="button" id="reset" class="quiet">再练一次</button>
          </div>
        </div>
        <p id="practice-status" role="status" class="status">正在载入演练。</p>
      </section>

      <aside aria-labelledby="camera-title">
        <h2 id="camera-title">映照 · 相机预览</h2>
        <p id="camera-help">摄像头需主动允许。可将设备与脸部保持平行。预览不会抓拍或上传。</p>
        <video id="camera" muted playsinline aria-label="摄像头画面预览" hidden></video>
        <div class="actions">
          <button id="camera-open" type="button" class="quiet" aria-describedby="camera-help" disabled>允许并打开预览</button>
          <button id="camera-close" type="button" class="quiet" hidden>关闭摄像头</button>
          <button id="sample" type="button" class="quiet" disabled>演练观测反馈</button>
        </div>
        <p id="camera-status" role="status" class="status"></p>
        <button id="read-observation" type="button" class="quiet" hidden>朗读观测说明</button>
      </aside>
    </div>

    <section id="memory" class="memory" aria-labelledby="memory-title">
      <h2 id="memory-title">拾光 · 美妆记忆</h2>
      <p id="memory-help">先预览，再决定是否保存。这里使用临时演练记录。</p>
      <form id="memory-form">
        <label for="preference">想保留的妆效偏好</label>
        <input id="preference" maxlength="240" placeholder="例如：偏好自然哑光" required>
        <div class="actions"><button type="submit" id="propose" disabled>预览偏好</button><button type="button" class="quiet" id="cancel-edit" hidden>退出更正</button></div>
      </form>
      <div id="proposal" class="result" hidden>
        <p id="proposal-text"></p>
        <div class="actions"><button type="button" id="save">确认保存</button><button type="button" id="discard" class="quiet">不保存</button></div>
      </div>
      <p id="memory-status" role="status" class="status"></p>
      <ul id="records" aria-label="已确认的演练记录"></ul>
    </section>
  </main>
</body>
</html>
